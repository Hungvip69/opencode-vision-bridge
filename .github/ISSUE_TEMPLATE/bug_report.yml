name: Bug report
description: Report a problem with opencode-vision-bridge
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Output of `opencode --version`
      placeholder: e.g. 1.18.15
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Installed version or commit of opencode-vision-bridge
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model / provider
      description: The model and provider that received the image (e.g. `deepseekk/deepseek-v4-flash-0731`)
      placeholder: e.g. deepseekk/deepseek-v4-flash-0731
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include whether the image part was replaced, an error was shown, or nothing happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: OpenCode debug logs mentioning `opencode-vision-bridge` or `Gemini`. Please no API keys or sensitive content.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your plugin config entry (redact the API key)
      render: json
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - WSL
    validations:
      required: true
